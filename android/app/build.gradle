plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.debojitsantra.joyrelay'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.debojitsantra.joyrelay'
        minSdk 31
        targetSdk 34
        versionCode 5
        versionName '0.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
