name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/joyrelay-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/joyrelay-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: android

      - name: Align and sign APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/zipalign" -f -v 4 "$unsigned" JoyRelay-android-aligned.apk
          "$build_tools/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out JoyRelay-android.apk JoyRelay-android-aligned.apk
          "$build_tools/apksigner" verify --verbose JoyRelay-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: JoyRelay-android.apk
          if-no-files-found: error

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pystray pillow portalocker evdev

      - name: Build Linux app
        run: python build.py
        working-directory: pc

      - name: Package Linux app
        run: tar -czf JoyRelay-linux-x64.tar.gz -C pc/dist JoyRelay

      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: JoyRelay-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies (except vgamepad)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          Get-Content requirements.txt |
            Where-Object { $_ -notmatch '^\s*vgamepad' } |
            Set-Content req-no-vgamepad.txt
          python -m pip install --upgrade -r req-no-vgamepad.txt
        working-directory: pc

      - name: Install vgamepad without the ViGEmBus installer
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/yannbouteiller/vgamepad.git vg
          Write-Host "---- setup.py ----"
          Get-Content vg\setup.py
          Write-Host "---- installer-related lines ----"
          Select-String -Path vg\setup.py -Pattern "subprocess|\.exe|\.msi|Popen|os\.system|urlretrieve|urlopen"
          (Get-Content vg\setup.py) |
            ForEach-Object { $_ -replace '^(\s*)(subprocess\.\w+\(.*)$', '$1pass  # $2' } |
            Set-Content vg\setup.py
          python -m pip install .\vg

      - name: Build Windows app
        run: python build.py
        working-directory: pc

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: pc/dist/JoyRelay.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksum files
        working-directory: release-assets
        run: |
          for f in *; do
            sha256sum "$f" > "$f.sha256.txt"
          done
          ls -l

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
